<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagadka w Lochach / Dungeon Puzzle</title>
    <style>
        :root {
            --bg-color: #0c0a10;
            --panel-bg: #161224;
            --accent-gold: #f39c12;
            --accent-glow: rgba(243, 156, 18, 0.4);
            --text-main: #f0f0f5;
            --text-muted: #9b99b0;
            --danger: #e74c3c;
            --border-color: #3d2c5e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .lang-switch {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .lang-switch:hover {
            border-color: var(--accent-gold);
        }

        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            background: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats-bar span {
            color: var(--text-main);
            font-weight: bold;
        }

        .rules-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 15px;
        }

        .rule-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .rule-card strong {
            display: block;
            color: var(--text-main);
            margin-bottom: 2px;
            font-size: 0.8rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .cell {
            background: #231c38;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, border-color 0.2s;
        }

        .cell:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 id="ui-title">Zagadka w Lochach</h1>
        <button class="lang-switch" onclick="toggleLanguage()">EN / PL</button>
    </div>

    <div class="top-bar">
        <button class="btn" onclick="openMap()" id="btn-map">🗺️ Mapa</button>
        <button class="btn" onclick="openShop()" id="btn-shop">🛒 Sklep</button>
    </div>

    <div class="stats-bar">
        <div><span id="txt-dungeon">Loch</span>: <span id="dungeon-num">1</span></div>
        <div><span id="txt-floor">Piętro</span>: <span id="floor-num">3/5</span></div>
        <div>⏱️ <span id="txt-time">Czas</span>: <span id="timer-val">12s</span></div>
        <div>🪙 <span id="txt-gold">Złoto</span>: <span id="gold-val">110</span></div>
    </div>

    <div class="rules-container">
        <div class="rule-card">
            <strong id="rule1-title">1 na Kolumnę</strong>
            <span id="rule1-desc">& Wiersz</span>
        </div>
        <div class="rule-card">
            <strong id="rule2-title">1 na Kolor</strong>
            <span id="rule2-desc">Regionu</span>
        </div>
        <div class="rule-card">
            <strong id="rule3-title">Brak styków</strong>
            <span id="rule3-desc">(Nawet rogami)</span>
        </div>
    </div>

    <div class="grid" id="game-grid">
        <!-- Plansza generowana dynamicznie -->
    </div>

    <script>
        let currentLang = 'pl';

        const translations = {
            pl: {
                title: "Zagadka w Lochach",
                map: "🗺️ Mapa",
                shop: "🛒 Sklep",
                dungeon: "Loch",
                floor: "Piętro",
                time: "Czas",
                gold: "Złoto",
                r1Title: "1 na Kolumnę",
                r1Desc: "& Wiersz",
                r2Title: "1 na Kolor",
                r2Desc: "Regionu",
                r3Title: "Brak styków",
                r3Desc: "(Nawet rogami)"
            },
            en: {
                title: "Dungeon Puzzle",
                map: "🗺️ Map",
                shop: "🛒 Shop",
                dungeon: "Dungeon",
                floor: "Floor",
                time: "Time",
                gold: "Gold",
                r1Title: "1 per Column",
                r1Desc: "& Row",
                r2Title: "1 per Color",
                r2Desc: "Region",
                r3Title: "No Touching",
                r3Desc: "(Even corners)"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'pl' ? 'en' : 'pl';
            updateTexts();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('btn-map').innerText = t.map;
            document.getElementById('btn-shop').innerText = t.shop;
            document.getElementById('txt-dungeon').innerText = t.dungeon;
            document.getElementById('txt-floor').innerText = t.floor;
            document.getElementById('txt-time').innerText = t.time;
            document.getElementById('txt-gold').innerText = t.gold;
            document.getElementById('rule1-title').innerText = t.r1Title;
            document.getElementById('rule1-desc').innerText = t.r1Desc;
            document.getElementById('rule2-title').innerText = t.r2Title;
            document.getElementById('rule2-desc').innerText = t.r2Desc;
            document.getElementById('rule3-title').innerText = t.r3Title;
            document.getElementById('rule3-desc').innerText = t.r3Desc;
        }

        function openMap() {
            alert(currentLang === 'pl' ? "Otwieranie mapy lochów..." : "Opening dungeon map...");
        }

        function openShop() {
            alert(currentLang === 'pl' ? "Otwieranie sklepu..." : "Opening shop...");
        }

        // Przykładowe renderowanie siatki
        const grid = document.getElementById('game-grid');
        for (let i = 0; i < 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (i === 5) cell.innerText = '⚔️';
            if (i === 9) cell.innerText = '⚔️';
            if (i === 11) cell.innerText = '🎯';
            if (i === 13) cell.innerText = '⚔️';
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
